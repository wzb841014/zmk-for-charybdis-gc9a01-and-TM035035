name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zmkfirmware/zmk
          path: zmk
          submodules: true
      
      - name: Setup config
        run: |
          mkdir -p zmk/config
          cp -r ${{ github.workspace }}/* zmk/config/ || true          
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install west
      
      - run: |
          cd zmk
          west init -l config
          west update          
      
      - run: |
          cd zmk
          west build -b nrf52840dk_nrf52840 -s app          
