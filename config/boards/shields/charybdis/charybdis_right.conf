CONFIG_DISPLAY=y                                                                                                     
CONFIG_GC9A01A=y  

# 基础配置
CONFIG_ZMK_KEYBOARD_NAME="Charybdis"

# 禁用电池检测（避免 ADC 问题）
CONFIG_ZMK_BATTERY=n


# 启用 USB
CONFIG_ZMK_USB=y

# 启用蓝牙
CONFIG_ZMK_BLE=y

# 如果用了 PMW3610
CONFIG_SPI=y


