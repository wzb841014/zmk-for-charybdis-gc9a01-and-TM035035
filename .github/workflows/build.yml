name: Build ZMK Firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    
    strategy:
      fail-fast: false
      matrix:
        # 在这里定义你要构建的组合
        include:
          - side: left
            shield: charybdis_left
          - side: right
            shield: charybdis_right

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update

      - name: West Zephyr Export
        run: west zephyr-export

      # ---------------------------------------------------------
      # 👇 这里是你要修改的核心部分 👇
      # ---------------------------------------------------------
      - name: Build ZMK firmware (${{ matrix.side }})
        run: |
          west build -d build/${{ matrix.side }} \
            -b pinnacle_100 \
            -- -DSHIELD=${{ matrix.shield }} \
            -DZMK_CONFIG=${{ github.workspace }}/config
      
      - name: Rename Firmware
        run: |
          cp build/${{ matrix.side }}/zephyr/zmk.uf2 zmk-${{ matrix.shield }}.uf2

      - name: Upload Firmware (${{ matrix.side }})
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.side }}
          path: zmk-${{ matrix.shield }}.uf2
