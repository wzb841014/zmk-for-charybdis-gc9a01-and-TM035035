manifest:
  self:
    path: config

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: gc9a01a_origin
      url-base: https://github.com/wzb841014

  projects:
    # ZMK 核心
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml

    # Zephyr (必须用 v4.1.0+zmk-fixes)
    - name: zephyr
      remote: zmkfirmware
      revision: v4.1.0+zmk-fixes

    # GC9A01A 驱动
    - name: gc9a01a_zephyr_driver
      remote: gc9a01a_origin
      revision: main
