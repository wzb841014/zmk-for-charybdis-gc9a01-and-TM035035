name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zmkfirmware/zmk
          path: zmk
          submodules: true
      
      - uses: actions/checkout@v4
        with:
          path: zmk/config
    
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: |
          pip install west
          cd zmk
          west update          
      
      - run: |
          cd zmk
          west build -b nrf52840dk_nrf52840 -s app
